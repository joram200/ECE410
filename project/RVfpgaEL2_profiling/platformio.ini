; --- CMakeLists.txt settings incorporated below ---
; Mirrors: set(CMAKE_CXX_FLAGS "-pg -g -std=c++11")
;          find_package(Eigen3 REQUIRED)
;          add_executable(kalman-test kalman.cpp kalman-test.cpp)
build_flags =
    -std=c++14
    -pg
    -g
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/lib/eigen-5.0.0
    -include ${PROJECT_DIR}/include/eigen_compat.h
    -lstdc++
    -lm
    -Wl,--defsym,__stack_size=0x40000
    -Wl,--wrap=_exit

; Include src/kalman.cpp (default) plus test/kalman-test.cpp (contains main())
build_src_filter = +<*> +<../test/kalman-test.cpp>

; Prevent PlatformIO LDF from treating eigen-5.0.0 as a managed library
; (it is header-only; its benchmark/test .cpp files must not be compiled)
lib_ignore = eigen-5.0.0