; PlatformIO Project Configuration File — Kalman Hardware Driver
;
; Bare-metal test for the Kalman accelerator at 0x80010000.
; Profiling: GDB JTAG memory reads (mcycle CSR + bump allocator), not gprof.
; Run scripts/run_profiles.sh after programming the FPGA.

[env:swervolf_nexys]
platform = chipsalliance
board = swervolf_nexys
framework = wd-riscv-sdk

monitor_speed = 115200

board_build.bitstream_file = ../SoC_impl/SoC_impl.runs/impl_1/rvfpganexys.bit
board_debug.verilator.binary = /run/media/sackb/Windows-SSD/Users/sackb/OneDrive/Desktop/University/Course_Work/2025-2026/Spring_2026/ECE_540/ece540_RVfpga/RVfpgaEL2/RVfpga_NexysA7-DDR/Simulators/verilatorSIM_Trace/OriginalBinaries/Vrvfpgasim_Ubuntu22

build_flags =
    -std=c++14
    -g
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/lib/eigen-5.0.0
    -include ${PROJECT_DIR}/include/eigen_compat.h
    -lstdc++
    -lm
    -Wl,--defsym,__stack_size=0x20000
    -Wl,--wrap=_exit
